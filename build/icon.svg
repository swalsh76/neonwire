<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b2e"/>
      <stop offset="1" stop-color="#07060d"/>
    </linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- cut-corner plate -->
  <path d="M24 24H420L488 92V488H92L24 420Z" fill="url(#bg)"/>
  <path d="M24 24H420L488 92V488H92L24 420Z" fill="url(#grid)"/>
  <path d="M24 24H420L488 92V488H92L24 420Z" fill="none" stroke="#00f0ff" stroke-width="8" stroke-opacity="0.55"/>
  <!-- neon N -->
  <path d="M136 384V128L376 384V128" fill="none" stroke="url(#n)" stroke-width="56" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
  <path d="M136 384V128L376 384V128" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="12" stroke-linecap="square"/>
  <!-- signal blip -->
  <rect x="408" y="408" width="44" height="44" fill="#f9f002" filter="url(#glow)"/>
  <path d="M24 24H140" stroke="#f9f002" stroke-width="10"/>
</svg>
