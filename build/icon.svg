<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16405a"/>
      <stop offset="1" stop-color="#071622"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 18v12M18 24h12" stroke="#93d9ff" stroke-opacity="0.22" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- chamfered plate -->
  <path d="M24 24H428L488 84V488H24Z" fill="url(#bg)"/>
  <path d="M24 24H428L488 84V488H24Z" fill="url(#grid)"/>
  <path d="M24 24H428L488 84V488H24Z" fill="none" stroke="#8cdcff" stroke-opacity="0.45" stroke-width="6"/>
  <!-- corner brackets -->
  <path d="M24 440V488H72M488 440V488H440" fill="none" stroke="#e3f4ff" stroke-width="10"/>
  <!-- broken concentric rings -->
  <g transform="translate(256 262)" filter="url(#glow)" fill="none" stroke="#e3f4ff">
    <circle r="168" stroke-width="22" stroke-dasharray="300 26 170 26 400 40 94 0" transform="rotate(-70)"/>
    <circle r="122" stroke-width="34" stroke-dasharray="420 30 190 40 86 0" stroke="#5cd6ff" transform="rotate(20)"/>
    <circle r="70" stroke-width="8" stroke-opacity="0.8"/>
    <path d="M0 -26V26M-26 0H26" stroke-width="7" stroke="#e3f4ff"/>
  </g>
  <!-- blocky tabs on the outer ring -->
  <g fill="#e3f4ff">
    <rect x="244" y="60" width="24" height="36"/>
    <rect x="404" y="246" width="40" height="24" transform="rotate(28 424 258)"/>
    <rect x="70" y="300" width="40" height="24" transform="rotate(-20 90 312)"/>
  </g>
  <!-- amber status tag -->
  <rect x="58" y="58" width="96" height="14" fill="#ffb347"/>
</svg>
